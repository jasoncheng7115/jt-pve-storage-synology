name: Checks and .deb build

# Every push and pull request. The .deb is an artefact here rather than a
# release: releases come from a tag, in release.yml.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Safety and syntax checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Without these, `perl -c` fails at "Can't locate JSON.pm" — which is
      # not "Can't locate PVE/", the only failure the syntax target tolerates.
      # A related project had exactly this missing and its CI failed on every
      # run for months, at the first step.
      - name: Install runtime Perl modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwww-perl liblwp-protocol-https-perl libjson-perl liburi-perl

      # Each guard is its own step so that a red run says which rule was
      # broken without anyone opening the log.
      - name: Forbid node-wide multipath flush
        run: make check-multipath-flush

      - name: Forbid credentials in URLs
        run: make check-secrets

      - name: Perl syntax
        run: make syntax

      - name: Unit tests
        run: make unit

      # Documents come in pairs. A change that updates one language and not
      # the other is the most common way this family of projects has shipped a
      # half-translated page.
      - name: Every document has both languages
        run: |
          fail=0
          for f in README.md docs/TESTING.md docs/DSM-ACCOUNT.md; do
            case "$f" in
              README.md) pair="README_zh-TW.md" ;;
              *)         pair="${f%.md}_zh-TW.md" ;;
            esac
            if [ ! -f "$pair" ]; then
              echo "ERROR: $f has no $pair"
              fail=1
            fi
          done
          exit $fail

  build-deb:
    name: Build .deb
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot \
            libwww-perl liblwp-protocol-https-perl libjson-perl liburi-perl

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      - name: Collect
        run: |
          mkdir -p artifacts
          cp ../jt-pve-storage-synology_*_all.deb artifacts/
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: jt-pve-storage-synology-deb
          path: artifacts/jt-pve-storage-synology_*_all.deb
          if-no-files-found: error
          retention-days: 30
